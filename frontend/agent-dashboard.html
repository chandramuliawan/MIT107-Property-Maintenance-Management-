<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Agent Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">
        <h2>Property Management Tracker</h2>
    </nav>

    <div class="container">

        <h1>Welcome, Agent</h1>

        <p>Manage Assigned Maintenance Requests</p>

        <input
            type="text"
            id="searchBox"
            placeholder="Search Requests">

        <table>

            <tr>
                <th>Issue</th>
                <th>Tenant</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            <tr id="heaterRow">
                <td>Broken Heater</td>
                <td>Alex</td>
                <td class="open">OPEN</td>

                <td>
                    <button
                        type="button"
                        onclick="location.href='agent-issue-details.html'">

                        Open

                    </button>
                </td>

            </tr>

            <tr id="tapRow">
                <td>Leaking Tap</td>
                <td>Sam</td>
                <td class="in-progress">IN PROGRESS</td>

                <td>
                    <button
                        type="button"
                        onclick="location.href='agent-issue-details.html'">

                        Open

                    </button>
                </td>

            </tr>

        </table>

    </div>

<script src="app.js"></script>

</body>

</html>
