<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Maintenance Request</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">
        <h2>Property Management Tracker</h2>
    </nav>

    <div class="container">

        <button
           type="button"
           onclick="window.location.href='tenant-dashboard.html'">

            ← Back to Dashboard
            
        </button>

        <h1>Create Maintenance Request</h1>

        <p>
            Submit a new maintenance issue for review.
        </p>

        <form>

            <label>Issue Title</label>

            <input
                type="text"
                id="issueTitle"
                placeholder="Enter issue title">

            <label>Category</label>

            <select id="category">

                <option>Plumbing</option>
                <option>Electrical</option>
                <option>Heating / Cooling</option>
                <option>Appliances</option>
                <option>Other</option>

            </select>

            <label>Property Address</label>

            <input
                type="text"
                value="15 Example Street, Melbourne VIC 3000"
                readonly>

            <label>Issue Details</label>

            <textarea
                id="issueDetails"
                rows="6"
                placeholder="Describe the issue">
            </textarea>

            <button
                type="button"
                onclick="window.location.href='tenant-dashboard.html'">

                Submit Request

            </button>

        </form>

    </div>

</body>

</html>
