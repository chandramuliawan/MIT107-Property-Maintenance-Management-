<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Maintenance Request</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body data-page="new-issue">
    <nav class="navbar">
        <a class="brand" href="./tenant-dashboard.html"><img src="./images/MendMate%20Icon-A.png" alt="" aria-hidden="true">Property Management Tracker</a>
        <div class="nav-user"><span id="userName"></span><button class="button button-quiet" type="button" data-logout>Log out</button></div>
    </nav>
    <main class="container form-container">
        <a class="back-link" href="./tenant-dashboard.html">← Back to Dashboard</a>
        <section class="page-heading compact">
            <div><p class="eyebrow">NEW REQUEST</p><h1>Create Maintenance Request</h1><p class="subheading">Submit a new maintenance issue for review.</p></div>
        </section>
        <p id="pageMessage" class="message" aria-live="polite"></p>
        <form id="issueForm" class="panel form-panel">
            <label for="issueTitle">Issue title</label>
            <input type="text" id="issueTitle" name="issueTitle" maxlength="120" placeholder="e.g. Leak under kitchen sink" required>

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="PLUMBING">Plumbing</option>
                <option value="ELECTRICAL">Electrical</option>
                <option value="HEATING_COOLING">Heating / Cooling</option>
                <option value="APPLIANCES">Appliances</option>
                <option value="MISCELLANEOUS">Miscellaneous</option>
            </select>

            <label for="propertyAddress">Property address</label>
            <input type="text" id="propertyAddress" readonly>

            <label for="issueDetails">Describe the issue</label>
            <textarea id="issueDetails" name="issueDetails" rows="6" maxlength="4000" placeholder="Include when it started and any details that may help." required></textarea>
            <p id="issueMessage" class="message" aria-live="polite"></p>
            <div class="form-actions">
                <a class="button button-secondary" href="./tenant-dashboard.html">Cancel</a>
                <button class="button button-primary" type="submit" id="submitIssueBtn">Submit request</button>
            </div>
        </form>
    </main>
    <script type="module" src="./app.js"></script>
</body>

</html>
