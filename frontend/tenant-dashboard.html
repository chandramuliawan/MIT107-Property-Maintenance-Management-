<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tenant Dashboard</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body data-page="tenant-dashboard">
    <nav class="navbar">
        <a class="brand" href="./tenant-dashboard.html">Property Management Tracker</a>
        <div class="nav-user"><span id="userName"></span><button class="button button-quiet" type="button" data-logout>Log out</button></div>
    </nav>
    <main class="container">
        <section class="page-heading">
            <div>
                <p class="eyebrow">TENANT PORTAL</p>
                <h1>Welcome, <span id="welcomeName">Tenant</span></h1>
                <p class="subheading">Your registered property: <strong id="propertyAddress">your property</strong></p>
            </div>
            <a class="button button-primary" href="./new-issue.html">+ New Issue</a>
        </section>
        <p id="pageMessage" class="message" aria-live="polite"></p>
        <section class="panel">
            <div class="panel-heading">
                <div><p class="eyebrow">YOUR REQUESTS</p><h2>Maintenance history</h2></div>
                <span class="muted">Updates from your property agent</span>
            </div>
            <p id="emptyState" class="message" aria-live="polite"></p>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Issue</th><th>Category</th><th>Reported</th><th>Status</th><th>Priority</th><th></th></tr></thead>
                    <tbody id="issueRows"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script type="module" src="./app.js"></script>
</body>

</html>
