<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Property Management Tracker
    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>
            Property Management Tracker
        </h1>

        <p>
            Sign in to continue
        </p>

        <form>

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email address">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password">

            <button type="submit">
                Log In
            </button>

        </form>

    </div>

</body>

</html>
