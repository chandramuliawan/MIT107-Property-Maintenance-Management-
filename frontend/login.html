<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Management Tracker</title>

    <link rel="stylesheet" href="./frontend/style.css">
</head>

<body data-page="login">

    <main class="login-shell">
        <section class="login-card">
            <a class="brand" href="/" aria-label="Property Maintenance home">Property Management Tracker</a>
            <p class="eyebrow">MAINTENANCE PORTAL</p>
            <h1>Property Management Tracker</h1>
            <p class="subheading">Sign in to continue</p>

            <form id="authForm">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>

                <div id="signupFields" hidden>
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" autocomplete="name" placeholder="Your name">

                    <label for="contact">Phone number</label>
                    <input type="tel" id="contact" name="contact" autocomplete="tel" placeholder="Your contact number">

                    <label for="propertyAddress">Property address</label>
                    <input type="text" id="propertyAddress" name="propertyAddress" autocomplete="street-address" placeholder="Your rental property address">
                </div>

                <p id="loginMessage" class="message" aria-live="polite"></p>
                <button class="button button-primary button-full" type="submit" id="loginBtn">Log in</button>
            </form>
            <button class="text-button" type="button" id="toggleSignup">New tenant? Create an account</button>
            <p class="login-note">Agents should sign in with their property management account.</p>
        </section>
    </main>

    <script type="module" src="./frontend/app.js"></script>
</body>

</html>
